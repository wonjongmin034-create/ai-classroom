<!doctype html>
<html lang="ko"><head><meta charset="utf-8" />
<title>AI 교실 — 원종민</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="테마별로 모아 보는 수업·업무 강의자료 허브" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="hub.css" />
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="./"><span class="logo">AI</span> 교실</a>
    <nav class="nav"><a class="on" href="./">자료실</a><a href="tools.html">도구함</a><a href="prompts.html">프롬프트</a></nav>
    <label class="search"><span aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="자료 검색 (제목·태그)" autocomplete="off" />
    </label>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <p class="kicker">원종민의 수업·업무 자료실</p>
    <h1>말로 만드는<br>수업과 업무</h1>
    <p class="lead">강의자료를 테마별로 모아 두었어요. 눌러서 바로 보고, PDF로 받아 가세요.</p>
  </div>
</section>

<main class="wrap">
  <div class="themes" id="themes" aria-label="테마"></div>
  <div class="bar2"><h2 id="listTitle">전체 자료</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>조건에 맞는 자료가 없어요.</p>
</main>

<footer class="foot wrap">© 2026 원종민 · AI 교실</footer>

<script>
(function(){
  var data, counts = {}, cur = 'all', q = '';
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function themeOf(id){ return data.themes.filter(function(t){ return t.id === id; })[0]; }

  function renderThemes(){
    var all = '<button class="tcard'+(cur==='all'?' on':'')+'" data-t="all" style="--c:#1b2236"><span class="em">📚</span><b>전체</b><small>'+data.materials.length+'개 자료</small></button>';
    $('themes').innerHTML = all + data.themes.map(function(t){
      var n = data.materials.filter(function(m){ return m.theme === t.id; }).length;
      return '<button class="tcard'+(cur===t.id?' on':'')+'" data-t="'+t.id+'" style="--c:'+t.color+'"><span class="em">'+t.emoji+'</span><b>'+esc(t.name)+'</b><small>'+(n ? n+'개 자료' : '준비 중')+'</small></button>';
    }).join('');
  }

  function renderGrid(){
    var list = data.materials.filter(function(m){
      if (cur !== 'all' && m.theme !== cur) return false;
      if (!q) return true;
      var hay = (m.title+' '+(m.subtitle||'')+' '+(m.tags||[]).join(' ')).toLowerCase();
      return hay.indexOf(q) > -1;
    });
    var t = cur === 'all' ? null : themeOf(cur);
    $('listTitle').textContent = t ? t.emoji + ' ' + t.name : '전체 자료';
    $('count').textContent = list.length + '개';
    $('empty').hidden = list.length > 0;
    $('grid').innerHTML = list.map(function(m){
      var th = themeOf(m.theme) || {name:'', color:'#1b2236'};
      return '<article class="card" style="--c:'+th.color+'">'+
        '<a class="cover" href="'+esc(m.link)+'"'+(m.external?' target="_blank" rel="noopener"':'')+'><img loading="lazy" src="'+esc(m.cover)+'" alt="'+esc(m.title)+' 표지" /></a>'+
        '<div class="body"><span class="pill">'+esc(th.name)+'</span>'+
        '<h3><a href="'+esc(m.link)+'"'+(m.external?' target="_blank" rel="noopener"':'')+'>'+esc(m.title)+'</a></h3>'+
        (m.subtitle ? '<p class="sub">'+esc(m.subtitle)+'</p>' : '')+
        '<div class="tags">'+(m.tags||[]).map(function(x){ return '<span>#'+esc(x)+'</span>'; }).join('')+'</div>'+
        '<div class="meta">'+(m.pages ? m.pages+'장 · ' : '')+esc(m.author||'')+' · '+esc(m.date||'')+'</div>'+
        ((m.tools||[]).length||counts[m.id] ? '<div class="links"><a href="tools.html?m='+esc(m.id)+'">🧰 도구 '+((m.tools||[]).length)+'개</a><a href="prompts.html?m='+esc(m.id)+'">📋 프롬프트 '+(counts[m.id]||0)+'개</a></div>' : '')+
        '<div class="act"><a class="btn pri" href="'+esc(m.link)+'"'+(m.external?' target="_blank" rel="noopener"':'')+'>'+(m.external?'열기 ↗':'슬라이드 보기')+'</a>'+
        (m.pdf ? '<a class="btn" href="'+esc(m.pdf)+'" download>PDF ↓</a>' : '')+'</div></div></article>';
    }).join('');
  }

  function select(t){
    cur = t;
    try { history.replaceState(null, '', t === 'all' ? location.pathname : '#' + t); } catch (e) {}
    renderThemes(); renderGrid();
  }

  $('themes').addEventListener('click', function(e){
    var b = e.target.closest('[data-t]'); if (b) select(b.dataset.t);
  });
  $('q').addEventListener('input', function(){ q = this.value.trim().toLowerCase(); renderGrid(); });

  Promise.all([fetch('materials.json').then(function(r){ return r.json(); }), fetch('prompts.json').then(function(r){ return r.json(); }).catch(function(){ return []; })]).then(function(a){
    data = a[0];
    a[1].forEach(function(p){ counts[p.source] = (counts[p.source] || 0) + 1; });
    var h = location.hash.slice(1);
    if (h && themeOf(h)) cur = h;
    renderThemes(); renderGrid();
  }).catch(function(){
    $('grid').innerHTML = '<p class="empty">자료 목록을 불러오지 못했어요. 주소로 접속했는지 확인해 주세요.</p>';
  });
})();
</script>
</body></html>
